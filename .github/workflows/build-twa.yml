name: Build TWA APK and AAB

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Install Android API 36 and Bubblewrap
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0"
          # Bubblewrap validates the legacy tools/bin layout; modern SDKs use cmdline-tools.
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          npm install --global @bubblewrap/cli@1.27.0
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME + "/.bubblewrap/config.json", JSON.stringify({jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME}))'

      - name: Restore existing signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_FILE"
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > android.keystore

      - name: Generate TWA from the checked-in manifest
        run: |
          bubblewrap update --skipVersionUpgrade
          grep -Eq 'compileSdkVersion[[:space:]]+36' app/build.gradle
          grep -Eq 'targetSdkVersion[[:space:]]+36' app/build.gradle
          grep -Fq 'applicationId "onl.mayo.dune.twa"' app/build.gradle
          grep -Eq 'versionCode[[:space:]]+9' app/build.gradle
          grep -Fq 'versionName "1.1.0"' app/build.gradle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build signed APK and AAB
        run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify signed artifacts
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs app-release-signed.apk
          jarsigner -verify app-release-bundle.aab
          keytool -printcert -jarfile app-release-bundle.aab
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging app-release-signed.apk | head -n 5

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dune-twa-${{ github.sha }}
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: rm -f android.keystore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dune-twa-${{ github.sha }}

      - name: Create tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release-signed.apk
            app-release-bundle.aab
